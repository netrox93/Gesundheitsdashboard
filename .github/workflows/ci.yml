name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.9 ist die aelteste unterstuetzte Version und laeuft bewusst mit:
        # Konstrukte aus neueren Versionen (etwa datetime.UTC ab 3.11)
        # wuerden sonst erst beim Nutzer auffallen.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Linter
        run: ruff check .

      - name: Formatierung
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Seiten laden sich fehlerfrei
        run: python tools/check_pages.py
